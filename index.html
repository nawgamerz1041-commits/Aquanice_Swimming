<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aquanice – Les Renang</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{--bg:#fff;--ink:#0a2a6b;--mut:#4b5f87;--sky:#12a8ea;--soft:#eaf6fd;--line:#cfe3f2;--btn:#0a2a6b;--btnt:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#071733;--ink:#e8f3ff;--mut:#9db4d6;--soft:#0d2350;--line:#1c3a73;--btn:#12a8ea;--btnt:#04172f}}
:root[data-theme="dark"]{--bg:#071733;--ink:#e8f3ff;--mut:#9db4d6;--soft:#0d2350;--line:#1c3a73;--btn:#12a8ea;--btnt:#04172f}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque',Figtree,sans-serif;line-height:1.1;margin:0}
a{color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
header img{height:48px;width:auto;display:block}
nav{display:flex;gap:18px;font-weight:600;font-size:15px}
nav a{text-decoration:none;color:var(--mut)}nav a:hover{color:var(--ink)}
.btn{display:inline-block;background:var(--btn);color:var(--btnt);padding:12px 22px;border-radius:999px;font-weight:600;text-decoration:none;border:0;font:inherit;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink)}
:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
.hero{padding:48px 0 56px;background:linear-gradient(180deg,var(--soft),var(--bg))}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:32px;align-items:center}
.hero h1{font-size:clamp(38px,6vw,66px);font-weight:800}
.hero p{color:var(--mut);max-width:46ch;margin:16px 0 26px;font-size:19px}
.hero .acts{display:flex;gap:12px;flex-wrap:wrap}
.hero .logo{width:100%;max-width:380px;justify-self:center}
section{padding:56px 0}
h2{font-size:clamp(28px,4vw,40px);font-weight:800;margin-bottom:8px}
.sub{color:var(--mut);margin:0 0 28px;max-width:60ch}
.prog{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.prog div{border:1.5px solid var(--line);border-radius:16px;padding:20px;background:var(--bg)}
.prog div:nth-child(5){background:var(--ink);color:var(--bg);border-color:var(--ink)}
.prog div:nth-child(5) p{color:inherit;opacity:.85}
.prog h3{font-size:22px;margin-bottom:6px}
.prog p{margin:0;color:var(--mut);font-size:15px}
.team{width:100%;border-radius:20px;display:block;margin-bottom:28px;max-height:520px;object-fit:cover;object-position:top}
.coaches{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px}
.coach{text-align:center}
.coach img,.coach .ph{width:100%;aspect-ratio:1/1.1;object-fit:cover;border-radius:16px;background:var(--soft);display:grid;place-items:center;font-size:40px;color:var(--mut)}
.coach b{display:block;margin-top:10px;font-family:'Bricolage Grotesque',sans-serif;font-size:18px}
.coach span{color:var(--mut);font-size:14px}
.rules{columns:2 280px;column-gap:32px;padding-left:20px;margin:0}
.rules li{margin-bottom:8px}
.contact{background:var(--soft);border-radius:24px;padding:32px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:center}
footer{padding:28px 0;color:var(--mut);font-size:14px;text-align:center}
/* edit mode */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--ink);color:var(--bg);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.bar .btn{padding:8px 18px;background:var(--bg);color:var(--ink)}
.ed{display:none}
body.edit .ed{display:flex}
body.edit .bar~*{}
.pick{display:none;margin-top:8px;font-size:13px;font-weight:600;background:var(--sky);color:#04172f;padding:6px 12px;border-radius:999px;cursor:pointer;width:max-content}
body.edit .pick{display:inline-block}
.pick input{display:none}
.fld{display:none;width:100%;margin-top:6px;padding:6px 10px;border:1.5px dashed var(--sky);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px;text-align:center}
body.edit .fld{display:block}
body.edit{padding-bottom:70px}
@media(max-width:720px){.hero .wrap{grid-template-columns:1fr}.hero .logo{order:-1;max-width:240px}nav{display:none}}
</style>
</head>

<script>
const S=JSON.parse(document.getElementById('data').textContent);
const app=document.getElementById('app');
let canEdit=false,busy=false;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pick=(k,t)=>`<label class="pick">${t}<input type="file" accept="image/*" data-img="${k}"></label>`;
const fld=(k,ph)=>`<input class="fld" data-f="${k}" placeholder="${ph}" value="${esc(k.split('.').reduce((o,p)=>o?.[p],S))}">`;
function render(){
 const wa=S.wa?`https://wa.me/${S.wa.replace(/\D/g,'')}`:'';
 app.innerHTML=`
<header><div class="wrap"><a href="#"><img src="${S.logo}" alt="Logo Aquanice"></a>
<nav><a href="#program">Program</a><a href="#coach">Coach</a><a href="#aturan">Aturan</a><a href="#daftar">Daftar</a></nav></div></header>
<main>
<div class="hero"><div class="wrap"><div>
<h1>Belajar renang yang aman dan menyenangkan.</h1>
<p>Kelas untuk anak, dewasa, dan calon pendaftar TNI/Polri, dengan pelatih yang mendampingi dari pengenalan air sampai lancar.</p>
<div class="acts">${wa?`<a class="btn" href="${wa}">Daftar lewat WhatsApp</a>`:''}<a class="btn ${wa?'ghost':''}" href="#program">Lihat program</a></div></div>
<div><img class="logo" src="${S.logo}" alt="">${pick('logo','Ganti logo')}</div></div></div>
<section id="program"><div class="wrap"><h2>Program kelas</h2><p class="sub">Pilih kelas sesuai usia dan tujuanmu.</p>
<div class="prog">
<div><h3>Reguler</h3><p>Belajar berkelompok dengan jadwal tetap dan naik level bertahap.</p></div>
<div><h3>Private</h3><p>Satu pelatih untuk satu murid, jadwal disepakati bersama.</p></div>
<div><h3>Anak</h3><p>Pengenalan air lewat bermain, dengan pendampingan orang tua.</p></div>
<div><h3>Dewasa</h3><p>Dari pemula sampai memperbaiki teknik gaya renang.</p></div>
<div><h3>TNI/Polri</h3><p>Latihan renang untuk tes seleksi, dengan simulasi berkala.</p></div></div></div></section>
<section id="coach" style="background:var(--soft)"><div class="wrap"><h2>Coach Aquanice</h2><p class="sub">Tim pelatih yang mendampingi setiap sesi.</p>
<img class="team" src="${S.team}" alt="Tim coach Aquanice">${pick('team','Ganti foto tim')}
<div class="coaches" style="margin-top:20px">${S.coaches.map((c,i)=>`<div class="coach">${c.img?`<img src="${c.img}" alt="${esc(c.name)}">`:`<div class="ph">+</div>`}${pick('coaches.'+i+'.img','Ganti foto')}<b>${esc(c.name)}</b><span>${esc(c.role)}</span>${fld('coaches.'+i+'.name','Nama coach')}${fld('coaches.'+i+'.role','Peran')}</div>`).join('')}</div></div></section>
<section id="aturan"><div class="wrap"><h2>Aturan singkat</h2><p class="sub">Supaya latihan aman dan nyaman untuk semua.</p>
<ul class="rules"><li>Bilas sebelum masuk kolam; pakai pakaian dan topi renang.</li><li>Izin tidak hadir minimal beberapa jam sebelum sesi.</li><li>Pembayaran paket dilakukan di muka.</li><li>Anak kecil didampingi orang tua di area kolam.</li><li>Peserta sakit sebaiknya istirahat dulu.</li><li>Ikuti arahan pelatih dan lifeguard.</li></ul></div></section>
<section id="daftar"><div class="wrap"><div class="contact"><div><h2>Mau mulai berenang?</h2><p class="sub" style="margin:0">${S.addr?esc(S.addr):'Hubungi kami untuk jadwal dan biaya.'}</p>${fld('addr','Alamat kolam')}${fld('wa','Nomor WhatsApp, contoh 62812xxxx')}</div>
${wa?`<a class="btn" href="${wa}">Chat WhatsApp</a>`:''}</div></div></section>
</main>
<footer>© Aquanice Les Renang</footer>
<div class="bar ed"><span id="msg">Mode edit: ganti foto atau ubah teks, lalu simpan.</span><button class="btn" id="save">Simpan</button><button class="btn" id="cancel">Batal</button></div>
${canEdit&&!document.body.classList.contains('edit')?'<button class="btn" id="edt" style="position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:8">Edit situs</button>':''}`;
}
function setPath(k,v){const p=k.split('.');let o=S;while(p.length>1)o=o[p.shift()];o[p[0]]=v}
function shrink(file,max,type){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{const r=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*r;c.height=im.height*r;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL(type,.85))};im.onerror=rej;im.src=u})}
document.addEventListener('change',async e=>{
 const k=e.target.dataset.img;if(!k||!e.target.files[0])return;
 try{setPath(k,await shrink(e.target.files[0],k==='logo'?700:1100,k==='logo'?'image/png':'image/jpeg'));render()}catch(_){alert('Foto tidak bisa dibuka. Coba file JPG atau PNG lain.')}
});
document.addEventListener('input',e=>{const k=e.target.dataset.f;if(k)setPath(k,e.target.value)});
document.addEventListener('click',async e=>{
 const id=e.target.id;
 if(id==='edt'){document.body.classList.add('edit');render()}
 if(id==='cancel')location.reload();
 if(id==='save'&&!busy){busy=true;e.target.textContent='Menyimpan...';
  try{const a=await claude.use('artifact');if(!a)throw 0;
   const c=document.documentElement.cloneNode(true);c.querySelector('#app').innerHTML='';c.querySelector('body').className='';
   c.querySelector('#data').textContent=JSON.stringify(S).replace(/</g,'\\u003c');
   await a.publish('<!doctype html>\n'+c.outerHTML);
  }catch(_){busy=false;e.target.textContent='Simpan';document.getElementById('msg').textContent='Gagal menyimpan. Periksa koneksi lalu coba lagi.'}}
});
render();
(async()=>{try{const u=await claude.use('user');canEdit=!!(u&&u.canEdit());if(canEdit)render()}catch(_){}})();
</script>
</body>
</html>
